<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AskMyNotes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 450px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #168eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0879ce;
        }

        .answer {
            margin-top: 20px;
            padding: 20px;
            min-height: 50px;
            background: #f7f7f7;
            border-radius: 8px;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>AskMyNotes</h1>

        <div class="subtitle">
            Ask questions about your notes
        </div>

        <input
            type="text"
            id="question"
            placeholder="Type your question..."
        >

        <input
            type="file"
            id="file"
        >

        <button onclick="askQuestion()">
            Ask
        </button>

        <div class="answer" id="answer">
            Answer will appear here...
        </div>

    </div>


    <script>

        async function askQuestion() {

            const question = document.getElementById("question").value;
            const file = document.getElementById("file").files[0];

            const formData = new FormData();

            formData.append("question", question);

            if (file) {
                formData.append("file", file);
            }

            document.getElementById("answer").innerText =
                "Sending to backend...";

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/ask",
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const data = await response.json();

                document.getElementById("answer").innerText =
                    data.message;

            } catch (error) {

                document.getElementById("answer").innerText =
                    "Could not connect to backend.";

                console.error(error);
            }
        }

    </script>

</body>
</html>
